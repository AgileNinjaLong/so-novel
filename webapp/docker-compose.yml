services:
  novel-web:
    build:
      context: .
      args:
        SONOVEL_VERSION: "1.12.0"
        TOMATO_VERSION: "2.4.16"
    image: novel-webapp:local
    container_name: novel-webapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 管理员账号：不设置则后台 /admin 无法登录
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请先在 .env 中设置 ADMIN_PASSWORD}"
      # 新用户注册后默认赠送天数，0 表示需要管理员手动开通
      WEBAPP_DEFAULT_GRANT_DAYS: "${WEBAPP_DEFAULT_GRANT_DAYS:-0}"
      # HTTPS 部署时设为 1
      WEBAPP_COOKIE_SECURE: "${WEBAPP_COOKIE_SECURE:-0}"
      WEBAPP_DEFAULT_SOURCE: "${WEBAPP_DEFAULT_SOURCE:-sonovel}"
      # 与番茄服务之间的内部口令（仅容器内 127.0.0.1 通信）
      TOMATO_PASSWORD: "${TOMATO_PASSWORD:-webapp-internal}"
      WEBAPP_TASK_TIMEOUT: "${WEBAPP_TASK_TIMEOUT:-0}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
