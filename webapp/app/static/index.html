<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说下载 · 多源 WebUI</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">书</span>
    <div>
      <h1>小说下载</h1>
      <p class="sub">多来源 · 排队下载 · 不下发服务器文件</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="userChip" class="user-chip"><span class="dot"></span><span id="userName">…</span></span>
    <button id="adminBtn" class="icon-btn hidden">后台</button>
    <button id="logoutBtn" class="icon-btn">退出</button>
  </div>
</header>

<section class="source-bar card">
  <div class="source-left">
    <label for="sourceSelect">来源</label>
    <select id="sourceSelect"></select>
    <button id="switchBtn" class="btn">切换</button>
  </div>
  <div id="sourceStatus" class="source-status"></div>
</section>

<div id="accountBanner" class="banner bad hidden"></div>
<div id="switchBanner" class="banner hidden"></div>

<main class="layout">
  <section class="card search-card">
    <div class="card-head">
      <h2>找书</h2>
      <div id="modeTabs" class="tabs hidden">
        <button class="tab active" data-mode="search">书名搜索</button>
        <button class="tab" data-mode="link">粘贴链接</button>
      </div>
    </div>

    <div id="searchPane">
      <div class="searchbar">
        <span class="searchbar-icon" aria-hidden="true">⌕</span>
        <input id="searchBox" type="text" autocomplete="off" spellcheck="false"
               placeholder="输入书名，回车搜索">
        <button id="clearSearch" class="clear-btn hidden" title="清空">×</button>
        <button id="searchBtn" class="btn primary">搜索</button>
      </div>
      <p id="searchHint" class="field-hint">支持书名搜索；也可以直接把详情页链接粘进来。</p>
      <div id="searchMeta" class="search-meta"></div>
      <div id="searchResults" class="result-list"></div>
    </div>

    <div id="linkPane" class="hidden">
      <div class="field">
        <label for="urlBox">书籍详情页链接</label>
        <input id="urlBox" type="text" placeholder="https://example.com/book/12345/">
      </div>
      <p class="field-hint" id="linkHint"></p>
    </div>

    <div class="picker-bar">
      <div class="pick-info">
        <span class="pick-label">已选择</span>
        <span id="pickTitle" class="pick-title">尚未选择书籍</span>
      </div>
      <div class="pick-ops">
        <label for="fmtSelect" class="muted">格式</label>
        <select id="fmtSelect" class="fmt-select"></select>
        <input id="titleBox" type="text" placeholder="书名（可留空）" class="title-input">
        <button id="enqueueBtn" class="btn primary">加入下载队列</button>
      </div>
    </div>
    <p id="enqueueMsg" class="msg"></p>
  </section>

  <section class="card queue-card">
    <div class="card-head">
      <h2>下载队列 <span id="countBadge" class="badge info"></span></h2>
      <div class="queue-actions">
        <button id="bulkDeleteBtn" class="btn danger small hidden">删除选中<span id="bulkCount"></span></button>
        <button id="cleanupBtn" class="btn ghost small hidden">清理记录</button>
        <button id="refreshBtn" class="btn ghost small">刷新</button>
      </div>
    </div>
    <p class="field-hint">同一时间只下载一本；多人提交按顺序排队。下载完成后请及时「接收文件」——文件只在服务器临时保存，接收成功后立即删除，未接收会超时删除。</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="check-col"><input id="checkAll" type="checkbox" title="全选"></th>
            <th>状态</th><th>书名</th><th>来源</th><th>提交者</th><th>进度</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="taskBody"></tbody>
      </table>
      <p id="emptyQueue" class="empty">队列为空，先在上面找一本。</p>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3>切换下载来源</h3>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button id="modalCancel" class="btn ghost">取消</button>
      <button id="modalAfter" class="btn">等当前任务结束后切换</button>
      <button id="modalNow" class="btn danger">立即取消并切换</button>
    </div>
  </div>
</div>

<div id="receiveModal" class="modal hidden">
  <div class="modal-card">
    <h3>接收文件</h3>
    <p id="receiveText"></p>
    <div class="modal-actions">
      <button id="receiveCancel" class="btn ghost">取消</button>
      <button id="receiveOk" class="btn primary">开始接收</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
