<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说下载 · 多源 WebUI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">书</span>
    <div>
      <h1>小说下载 WebUI</h1>
      <p class="sub">多来源插件 · 全局单线程队列</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="userChip" class="user-chip"><span class="dot"></span><span id="userName">…</span></span>
    <button id="adminBtn" class="icon-btn hidden">后台管理</button>
    <button id="logoutBtn" class="icon-btn">退出</button>
  </div>
</header>

<section class="source-bar card">
  <div class="source-left">
    <label for="sourceSelect">下载来源</label>
    <select id="sourceSelect"></select>
    <button id="switchBtn" class="btn primary">切换来源</button>
  </div>
  <div id="sourceStatus" class="source-status"></div>
</section>

<div id="accountBanner" class="banner bad hidden"></div>
<div id="switchBanner" class="banner hidden"></div>

<main class="layout">
  <section class="card input-card">
    <h2 id="inputTitle">提交下载</h2>
    <p id="inputHint" class="hint"></p>
    <div id="searchMode" class="mode hidden">
      <div class="row">
        <input id="searchBox" type="text" placeholder="输入书名搜索…" autocomplete="off">
        <button id="searchBtn" class="btn">搜索</button>
      </div>
      <ul id="searchResults" class="results"></ul>
    </div>
    <div id="urlMode" class="mode hidden">
      <div class="row">
        <input id="urlBox" type="text" placeholder="粘贴书籍详情页链接" autocomplete="off">
      </div>
    </div>
    <div class="row">
      <label for="fmtSelect" class="muted">导出格式</label>
      <select id="fmtSelect" style="max-width:140px"></select>
    </div>
    <div class="row">
      <input id="titleBox" type="text" placeholder="书名（可留空，由来源识别）" autocomplete="off">
    </div>
    <div class="row">
      <button id="enqueueBtn" class="btn primary" style="flex:1">加入下载队列</button>
    </div>
    <p id="enqueueMsg" class="msg"></p>
  </section>

  <section class="card queue-card">
    <div class="queue-head">
      <h2>下载队列 <span id="countBadge" class="badge info"></span></h2>
      <div class="queue-actions">
        <button id="cleanupBtn" class="btn ghost small hidden">清理失败/取消</button>
        <button id="refreshBtn" class="btn ghost small">刷新</button>
      </div>
    </div>
    <p class="hint">同一时间只下载一本；多人同时提交按顺序排队，先到先得。下载完成后服务器只临时保存，请及时点「接收文件」，传输完成即从服务器删除。</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>状态</th><th>书名</th><th>来源</th><th>提交者</th><th>进度</th><th>操作</th></tr>
        </thead>
        <tbody id="taskBody"></tbody>
      </table>
      <p id="emptyQueue" class="empty">队列为空，先在上方提交一本吧。</p>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3>切换下载来源</h3>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button id="modalCancel" class="btn ghost">取消</button>
      <button id="modalAfter" class="btn">等当前任务结束后切换</button>
      <button id="modalNow" class="btn danger">立即取消并切换</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
