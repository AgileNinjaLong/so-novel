<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 小说下载 WebUI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>使用密钥激活</h1>
    <p class="subtitle">每把密钥只能激活一个账号；账号与密码由管理员生成，激活后即可用它们登录。</p>
    <div id="alert" class="alert bad hidden"></div>

    <div class="field">
      <label for="key">注册密钥</label>
      <input id="key" type="text" autocomplete="off" spellcheck="false" placeholder="21 位密钥，向管理员获取">
    </div>
    <div class="actions">
      <button id="checkBtn" class="btn primary" style="flex:1">查询密钥</button>
    </div>

    <div id="info" class="hidden" style="margin-top:16px">
      <div id="keySummary" class="alert ok"></div>
      <div class="field">
        <label>账号</label>
        <input id="account" type="text" readonly>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="text" readonly>
      </div>
      <div class="actions">
        <button id="activateBtn" class="btn primary" style="flex:1">激活并登录</button>
      </div>
      <p class="hint" style="margin-top:10px">激活后请记下这对账号密码，下次在登录页使用。</p>
    </div>

    <p class="switch-line">已有账号？<a href="/login">去登录</a></p>
  </div>
</div>
<script>
const alertBox = document.getElementById('alert');
let keyInfo = null;

function show(text, kind = 'bad') {
  alertBox.textContent = text;
  alertBox.className = 'alert ' + kind;
  alertBox.classList.toggle('hidden', !text);
}

async function api(url, opts = {}) {
  const options = { ...opts, headers: { ...(opts.headers || {}) }, credentials: 'same-origin' };
  if (options.body !== undefined) {
    options.headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(options.body);
  }
  const res = await fetch(url, options);
  if (res.status === 401) { location.href = '/login'; throw new Error('未登录'); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) {}
  if (!res.ok) {
    const msg = (data && data.detail) || `请求失败（${res.status}）`;
    throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
  }
  return data;
}

async function checkKey() {
  const key = document.getElementById('key').value.trim();
  if (!key) return show('请先输入密钥');
  show('');
  const data = await api('/api/auth/key-info?key=' + encodeURIComponent(key)).catch((err) => {
    show(err.message);
    return null;
  });
  if (!data) return;
  if (!data.valid) {
    document.getElementById('info').classList.add('hidden');
    show(data.reason || '密钥不可用');
    return;
  }
  keyInfo = data;
  document.getElementById('info').classList.remove('hidden');
  document.getElementById('keySummary').textContent = `密钥有效 · 有效期 ${data.days_text}`;
  document.getElementById('account').value = data.username || '';
  document.getElementById('password').value = data.password || '';
}

async function activate() {
  const key = document.getElementById('key').value.trim();
  if (!keyInfo) return show('请先查询密钥');
  try {
    await api('/api/auth/register', { method: 'POST', body: { key } });
    location.href = '/';
  } catch (err) {
    show(err.message);
  }
}

document.getElementById('checkBtn').addEventListener('click', checkKey);
document.getElementById('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkKey(); });
document.getElementById('activateBtn').addEventListener('click', activate);

fetch('/api/meta').then((r) => r.json()).then((meta) => {
  if (!meta.app.registration_open) show('当前没有可用密钥：管理员尚未生成，或已全部用完', 'bad');
}).catch(() => {});
document.getElementById('key').focus();
</script>
</body>
</html>
