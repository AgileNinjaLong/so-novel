<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 小说下载 WebUI</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>登录</h1>
    <p class="subtitle">输入账号密码进入下载界面</p>
    <div id="alert" class="alert bad hidden"></div>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" type="text" autocomplete="username" placeholder="用户名">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位">
    </div>
    <div class="actions">
      <button id="loginBtn" class="btn primary" style="flex:1">登录</button>
    </div>
    <p class="switch-line">还没有账号？<a id="registerLink" href="/register">用注册密钥注册</a></p>
    <p class="switch-line muted" id="closedTip" style="display:none">当前未开放注册（管理员尚未生成注册密钥）</p>
  </div>
</div>
<script>
const alertBox = document.getElementById('alert');
function show(text, kind = 'bad') {
  alertBox.textContent = text;
  alertBox.className = 'alert ' + kind;
}
async function submitLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return show('请输入用户名和密码');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (res.ok) { location.href = '/'; return; }
    let detail = '登录失败';
    try { const data = await res.json(); detail = data.detail || detail; } catch (_) {}
    show(typeof detail === 'string' ? detail : JSON.stringify(detail));
  } catch (err) {
    show('网络错误：' + err.message);
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('loginBtn').addEventListener('click', submitLogin);
['username', 'password'].forEach((id) => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitLogin();
  });
});
fetch('/api/meta').then((r) => r.json()).then((meta) => {
  if (!meta.app.registration_open) {
    document.getElementById('registerLink').style.display = 'none';
    document.getElementById('closedTip').style.display = 'block';
  }
}).catch(() => {});
document.getElementById('username').focus();
</script>
</body>
</html>
