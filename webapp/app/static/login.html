<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 小说下载 WebUI</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .login-wrap { min-height: 100vh; display: grid; place-items: center; background: var(--bg); }
  .login-card { width: min(380px, 92vw); }
  .login-card h2 { margin: 0 0 6px; font-size: 18px; }
  .login-card .hint { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <h2>访问口令</h2>
    <p class="hint">该站点已开启口令保护，请输入部署时设置的 WEBAPP_PASSWORD。</p>
    <div class="row">
      <input id="pwd" type="password" placeholder="口令" style="flex:1">
    </div>
    <div class="row">
      <button id="loginBtn" class="btn primary" style="width:100%">进入</button>
    </div>
    <p id="msg" class="msg"></p>
  </div>
</div>
<script>
  const msg = document.getElementById('msg');
  const pwd = document.getElementById('pwd');
  async function login() {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd.value }),
    });
    if (res.ok) { location.href = '/'; return; }
    let detail = '口令错误';
    try { detail = (await res.json()).detail || detail; } catch (_) {}
    msg.textContent = detail;
    msg.className = 'msg bad';
  }
  document.getElementById('loginBtn').addEventListener('click', login);
  pwd.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  pwd.focus();
</script>
</body>
</html>
