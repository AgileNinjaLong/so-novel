<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理 · 小说下载 WebUI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">管</span>
    <div>
      <h1>后台管理</h1>
      <p class="sub">注册密钥 · 用户有效期 · 全部任务</p>
    </div>
  </div>
  <div class="topbar-right">
    <span class="user-chip"><span class="dot"></span><span id="adminName">…</span></span>
    <a class="icon-btn" href="/">返回下载页</a>
    <button id="logoutBtn" class="icon-btn">退出</button>
  </div>
</header>

<div class="admin-wrap">
  <div class="admin-grid">
    <section class="card stat">
      <span class="v" id="userCount">0</span>
      <span class="k">注册用户</span>
    </section>
    <section class="card stat">
      <span class="v" id="queueInfo">0</span>
      <span class="k">队列 / 运行</span>
    </section>
    <section class="card stat">
      <span class="v" id="taskCount">0</span>
      <span class="k">任务总数</span>
    </section>
  </div>

  <section class="card">
    <div class="queue-head">
      <h2>生成注册密钥</h2>
      <span class="badge info" id="keyStatBadge"></span>
    </div>
    <p class="hint">每把密钥只能被一个用户使用；账号密码由用户注册时自己设置，注册成功后这里会显示绑定的账号与密码。</p>
    <div class="row">
      <label class="muted">有效期</label>
      <select id="keyDays" style="max-width:170px">
        <option value="1">1 天</option>
        <option value="7">7 天</option>
        <option value="31" selected>31 天（默认）</option>
        <option value="124">124 天</option>
        <option value="372">372 天</option>
        <option value="999999">永久</option>
        <option value="custom">自定义天数…</option>
      </select>
      <input id="keyCustomDays" type="number" min="1" max="65535" placeholder="1-65535 天"
             class="hidden" style="max-width:150px">
      <label class="muted">数量</label>
      <input id="keyCount" type="text" value="1" style="max-width:90px">
      <label class="muted">备注</label>
      <input id="keyNote" type="text" placeholder="给谁用（可选）" style="flex:1 1 160px">
    </div>
    <div class="row">
      <button id="genKeyBtn" class="btn primary">生成密钥</button>
      <span id="keySummaryHint" class="field-hint">将生成 1 把 · 每把 372 天</span>
    </div>
    <p id="keyMsg" class="msg"></p>
    <div id="keyList" class="user-list" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <div class="queue-head">
      <h2>用户列表 <span id="userBadge" class="badge info"></span></h2>
      <button id="refreshBtn" class="btn small ghost">刷新</button>
    </div>
    <p class="hint">有效期按钮为「叠加」：在当前到期时间上加天数，剩余天数上限 65535 天；「永久」为独立标记，不再计天数。</p>
    <div id="userList" class="user-list"></div>
    <p id="userMsg" class="msg"></p>
  </section>

  <section class="card">
    <div class="queue-head">
      <h2>全部任务 <span id="taskBadge" class="badge info"></span></h2>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>状态</th><th>书名</th><th>来源</th><th>提交者</th><th>进度</th><th>操作</th></tr>
        </thead>
        <tbody id="taskBody"></tbody>
      </table>
      <p id="emptyTasks" class="empty">暂无任务</p>
    </div>
    <p id="taskMsg" class="msg"></p>
  </section>
</div>

<script src="/static/admin.js"></script>
</body>
</html>
